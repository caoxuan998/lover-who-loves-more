<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>谁更爱对方 · 情侣测试</title>
  <meta name="description" content="52 道专业测评题，测出谁更爱对方。情侣双方各自答题，生成对比报告。">
  <meta name="theme-color" content="#FBF9F4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
/* ========== 设计令牌 ========== */
:root {
  --bg: #FBF9F4;
  --bg-soft: #F5F1E8;
  --paper: #FFFFFF;
  --ink: #2B2B2B;
  --ink-soft: #5A5650;
  --ink-faint: #9A958C;
  --line: #E6E1D6;
  --line-strong: #D2CCBE;
  --accent: #4A6B8A;
  --accent-deep: #36506B;
  --accent-soft: #DDE6EF;
  --accent-bg: #EEF2F7;
  --gold: #B89260;
  --green: #6B8E6F;
  --red: #B56060;
  --bronze: #B08968;
  --silver: #9AA5AD;
  --diamond: #7B9AD6;
  --radar-a: #4A6B8A;
  --radar-b: #E8888A;
  --sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --serif: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
  --r-sm: 6px;
  --r: 12px;
  --r-lg: 18px;
  --shadow: 0 1px 3px rgba(43,43,43,0.04);
  --shadow-md: 0 6px 24px rgba(74,107,138,0.10);
  --maxw: 480px;
  --pad: 22px;
  --fs-hook: 15px;
  --fs-body: 17px;
  --fs-detail: 18.5px;
  --fs-title: 24px;
  --fs-cat: 17px;
  --lh-body: 1.8;
  --lh-detail: 1.95;
  --letter: 0.04em;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  letter-spacing: 0.02em;
  -webkit-font-smoothing: antialiased;
  font-size: var(--fs-body);
  padding-top: max(14px, env(safe-area-inset-top));
}

.serif { font-family: var(--serif); }
.hidden { display: none !important; }
.center { text-align: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 22px; border: none; border-radius: 999px; cursor: pointer;
  font-family: var(--sans); font-size: 0.95rem; font-weight: 600; letter-spacing: 0.05em;
  transition: all .25s ease; text-decoration: none;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active { background: var(--accent-deep); transform: translateY(1px); }
.btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--line-strong); }
.btn-ghost:active { background: var(--accent-bg); }
.btn-block { width: 100%; padding: 15px; font-size: 1rem; }
.btn:disabled { opacity: .4; }

.eyebrow {
  font-size: 0.7rem; letter-spacing: 0.35em; text-transform: uppercase;
  color: var(--accent); font-weight: 600;
}
.h1 { font-family: var(--serif); font-size: 2.1rem; font-weight: 600; line-height: 1.2; letter-spacing: 0.06em; }
.h2 { font-family: var(--serif); font-size: 1.45rem; font-weight: 600; line-height: 1.3; }
.h3 { font-size: 1.05rem; font-weight: 700; }
.muted { color: var(--ink-soft); }
.faint { color: var(--ink-faint); }
.small { font-size: 0.82rem; }
.tiny { font-size: 0.72rem; }

.card {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 18px; box-shadow: var(--shadow);
}

.divider { height: 1px; background: var(--line); margin: 22px 0; }
.vline { width: 28px; height: 1px; background: var(--line-strong); margin: 18px auto; }

.tag {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  font-size: 0.72rem; background: var(--accent-bg); color: var(--accent-deep); font-weight: 600;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes popIn { 0% { opacity:0; transform: scale(.9);} 100%{opacity:1;transform:scale(1);} }
.screen { animation: fadeIn .5s cubic-bezier(.22,.61,.36,1); }

#toast {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
  background: rgba(43,43,43,0.92); color: #fff; padding: 11px 20px; border-radius: 999px;
  font-size: 0.85rem; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none;
  max-width: 80%; text-align: center;
}
#toast.show { opacity: 1; }

/* ========== 应用样式 ========== */
.app-wrap { max-width: var(--maxw); margin: 0 auto; min-height: 100vh; }

.app-page { display: none; animation: fadeIn .4s cubic-bezier(.22,.61,.36,1); }
.app-page.active { display: block; }

.topbar {
  position: sticky; top: 0; z-index: 40; max-width: var(--maxw);
  background: rgba(251,249,244,0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 12px 18px max(12px, env(safe-area-inset-bottom)); padding-top: max(12px, env(safe-area-inset-top));
  display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line);
}
.topbar .tb-title { flex: 1; font-family: var(--serif); font-size: 1.15rem; font-weight: 600; }
.topbar .icon-btn {
  border: 1px solid var(--line); background: var(--paper); width: 38px; height: 38px; border-radius: 50%;
  font-size: 1rem; color: var(--ink-soft); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
.topbar .icon-btn:active { background: var(--accent-bg); color: var(--accent); }
.topbar .test-progress { font-size: 0.85rem; color: var(--ink-soft); font-weight: 600; }

.home-inner { padding: 0 18px 80px; }
.brand { text-align: center; padding: 40px 0 22px; }
.brand .eyebrow { letter-spacing: 0.4em; }
.brand h1 { margin: 16px 0 10px; font-family: var(--serif); font-size: 2rem; font-weight: 700; letter-spacing: 0.08em; }
.brand .sub { color: var(--ink-soft); font-size: 0.9rem; line-height: 1.8; }
.brand .vline { width: 30px; height: 1px; background: var(--line-strong); margin: 18px auto; }

.home-features { margin-top: 24px; }
.feature-item {
  display: flex; align-items: center; gap: 14px; background: var(--paper);
  border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; margin-bottom: 12px;
}
.fi-icon {
  width: 44px; height: 44px; border-radius: 12px; background: var(--accent-bg); color: var(--accent);
  font-family: var(--serif); font-size: 1.3rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.fi-text { flex: 1; }
.fi-title { font-weight: 700; font-size: 0.95rem; }
.fi-desc { font-size: 0.82rem; color: var(--ink-soft); line-height: 1.6; margin-top: 2px; }

.foot-note { text-align: center; color: var(--ink-faint); font-size: 0.74rem; line-height: 1.8; padding: 30px 16px 10px; }

.progress-bar {
  height: 3px; background: var(--line); margin: 0 18px; border-radius: 2px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s ease;
  width: 0%;
}

.test-page { padding: 0 18px 90px; }
.question-card {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 24px 20px; margin: 20px 0; box-shadow: var(--shadow);
}
.q-dim {
  display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 0.74rem;
  font-weight: 600; margin-bottom: 14px; background: var(--accent-bg); color: var(--accent-deep);
}
.q-text {
  font-family: var(--serif); font-size: var(--fs-title); font-weight: 700;
  line-height: 1.4; margin-bottom: 20px; letter-spacing: 0.03em;
}
.q-options { display: flex; flex-direction: column; gap: 10px; }
.q-opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: left;
  background: var(--bg-soft); border: 1.5px solid var(--line); border-radius: var(--r);
  padding: 14px 16px; cursor: pointer; transition: all .2s; font-family: var(--sans);
}
.q-opt:active { transform: scale(.99); }
.q-opt.selected { border-color: var(--accent); background: var(--accent-bg); }
.q-opt .qo-letter {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
  background: var(--paper); border: 1px solid var(--line); color: var(--ink-soft);
  font-family: var(--serif); font-weight: 700; font-size: 0.85rem;
  display: flex; align-items: center; justify-content: center;
}
.q-opt.selected .qo-letter { background: var(--accent); color: #fff; border-color: var(--accent); }
.q-opt .qo-text { flex: 1; font-size: var(--fs-detail); line-height: 1.6; color: var(--ink); }

.test-nav {
  display: flex; gap: 10px; margin-top: 16px;
}
.test-nav button { flex: 1; }

.done-inner { padding: 80px 24px 40px; text-align: center; }
.done-icon {
  width: 64px; height: 64px; border-radius: 50%; background: var(--green); color: #fff;
  font-size: 1.8rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px; animation: popIn .5s;
}
.done-inner h2 { font-family: var(--serif); font-size: 1.6rem; margin-bottom: 8px; }
.done-inner p { color: var(--ink-soft); font-size: 0.95rem; }
.done-divider { height: 1px; background: var(--line); margin: 24px 0; }
.done-hint { color: var(--ink-soft); font-size: 0.9rem; line-height: 1.8; margin-bottom: 20px; }
.done-inner .btn { margin-bottom: 10px; }

.result-page { padding: 0 18px 90px; }
.result-header { text-align: center; padding: 20px 0 10px; }
.result-header .rh-label { font-size: 0.74rem; color: var(--accent); letter-spacing: 0.2em; font-weight: 600; }
.result-header .rh-score {
  font-family: var(--serif); font-size: 3rem; font-weight: 700; color: var(--accent); margin: 8px 0;
}
.result-header .rh-total { font-size: 0.85rem; color: var(--ink-soft); }

.result-radar {
  display: flex; justify-content: center; margin: 20px 0;
}
.result-radar canvas { max-width: 100%; }

.result-dims { margin-top: 20px; }
.dim-row {
  display: flex; align-items: center; gap: 10px; padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.dim-row:last-child { border-bottom: none; }
.dim-name { width: 70px; font-size: 0.85rem; color: var(--ink-soft); flex-shrink: 0; }
.dim-bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.dim-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
.dim-score { width: 40px; text-align: right; font-family: var(--serif); font-weight: 700; font-size: 0.95rem; }

.result-conclusion {
  background: var(--accent-bg); border-radius: var(--r-lg); padding: 20px;
  margin-top: 20px; text-align: center;
}
.rc-title { font-family: var(--serif); font-size: 1.2rem; font-weight: 700; color: var(--accent-deep); margin-bottom: 8px; }
.rc-text { font-size: 0.9rem; color: var(--ink-soft); line-height: 1.7; }

.result-actions { margin-top: 20px; display: flex; gap: 10px; }
.result-actions button { flex: 1; }

.compare-page { padding: 0 18px 90px; }
.compare-header { text-align: center; padding: 20px 0 10px; }
.compare-scores {
  display: flex; justify-content: center; gap: 30px; margin: 16px 0;
}
.cs-item { text-align: center; }
.cs-label { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 4px; }
.cs-score { font-family: var(--serif); font-size: 2.2rem; font-weight: 700; }
.cs-a .cs-score { color: var(--radar-a); }
.cs-b .cs-score { color: var(--radar-b); }

.compare-radar {
  display: flex; justify-content: center; margin: 20px 0;
}
.compare-radar canvas { max-width: 100%; }

.compare-dims { margin-top: 20px; }
.cdim-row {
  display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line);
}
.cdim-row:last-child { border-bottom: none; }
.cdim-name { width: 70px; font-size: 0.82rem; color: var(--ink-soft); flex-shrink: 0; }
.cdim-bars { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.cdim-bar-a, .cdim-bar-b {
  height: 6px; border-radius: 3px; transition: width .5s ease;
}
.cdim-bar-a { background: var(--radar-a); }
.cdim-bar-b { background: var(--radar-b); }
.cdim-scores {
  width: 80px; display: flex; gap: 6px; justify-content: flex-end;
}
.cdim-sa, .cdim-sb { font-family: var(--serif); font-weight: 700; font-size: 0.85rem; }
.cdim-sa { color: var(--radar-a); }
.cdim-sb { color: var(--radar-b); }

.compare-conclusion {
  background: var(--accent-bg); border-radius: var(--r-lg); padding: 20px;
  margin-top: 20px; text-align: center;
}
.cc-title { font-family: var(--serif); font-size: 1.2rem; font-weight: 700; color: var(--accent-deep); margin-bottom: 8px; }
.cc-text { font-size: 0.9rem; color: var(--ink-soft); line-height: 1.7; }

.compare-legend {
  display: flex; justify-content: center; gap: 20px; margin: 12px 0;
}
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--ink-soft); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.legend-a { background: var(--radar-a); }
.legend-b { background: var(--radar-b); }
  </style>
</head>
<body>
  <div class="app-wrap">
    <!-- 首页 -->
    <div id="page-home" class="app-page active">
      <div class="home-inner">
        <div class="brand">
          <div class="eyebrow">谁更爱对方</div>
          <h1>52 道题<br>测出谁更爱对方</h1>
          <div class="vline"></div>
          <div class="sub">情侣双方各自独立答题<br>完成后生成对比报告</div>
        </div>
        <button class="btn btn-primary btn-block" id="startBtn">开始测试</button>
        <div class="home-features">
          <div class="feature-item">
            <div class="fi-icon">8</div>
            <div class="fi-text">
              <div class="fi-title">8 个维度</div>
              <div class="fi-desc">情感投入、了解程度、包容度、安全感、付出意愿、沟通质量、未来规划、仪式感</div>
            </div>
          </div>
          <div class="feature-item">
            <div class="fi-icon">52</div>
            <div class="fi-text">
              <div class="fi-title">52 道题</div>
              <div class="fi-desc">专业测评题，15-20 分钟完成</div>
            </div>
          </div>
          <div class="feature-item">
            <div class="fi-icon">2</div>
            <div class="fi-text">
              <div class="fi-title">双方对比</div>
              <div class="fi-desc">各自答题，生成对比报告</div>
            </div>
          </div>
        </div>
        <button class="btn btn-ghost btn-block" id="viewResultBtn" style="display:none;">查看我的结果</button>
        <div class="foot-note">本测试仅供参考，不构成专业心理评估。<br>所有内容仅保存在你的设备本地。</div>
      </div>
    </div>

    <!-- 答题页 -->
    <div id="page-test" class="app-page">
      <div class="topbar">
        <button class="icon-btn" id="testBack" aria-label="返回">‹</button>
        <div class="tb-title">谁更爱对方</div>
        <div class="test-progress" id="testProgress">1/52</div>
      </div>
      <div class="test-page">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="question-card" id="questionCard">
          <div class="q-dim" id="qDim"></div>
          <div class="q-text" id="qText"></div>
          <div class="q-options" id="qOptions"></div>
        </div>
        <div class="test-nav">
          <button class="btn btn-ghost" id="prevBtn">上一题</button>
          <button class="btn btn-primary" id="nextBtn">下一题</button>
        </div>
      </div>
    </div>

    <!-- 完成页 -->
    <div id="page-done" class="app-page">
      <div class="done-inner">
        <div class="done-icon">✓</div>
        <h2>测试完成！</h2>
        <p>你的结果已保存</p>
        <div class="done-divider"></div>
        <p class="done-hint">让 TA 也做一遍<br>然后你们可以对比结果</p>
        <button class="btn btn-primary btn-block" id="shareLinkBtn">复制链接发给 TA</button>
        <button class="btn btn-ghost btn-block" id="viewMyResultBtn">先看我的结果</button>
      </div>
    </div>

    <!-- 结果页 -->
    <div id="page-result" class="app-page">
      <div class="topbar">
        <button class="icon-btn" id="resultBack" aria-label="返回">‹</button>
        <div class="tb-title">测试结果</div>
      </div>
      <div class="result-page" id="resultPage"></div>
    </div>

    <!-- 对比页 -->
    <div id="page-compare" class="app-page">
      <div class="topbar">
        <button class="icon-btn" id="compareBack" aria-label="返回">‹</button>
        <div class="tb-title">对比结果</div>
      </div>
      <div class="compare-page" id="comparePage"></div>
    </div>
  </div>

  <canvas id="shareCanvas" style="display:none;"></canvas>

  <script>
/* ========== 题目数据 ========== */
window.__LGA_DATA__ = {
  "version": 1,
  "dimensions": [
    { "key": "emotion", "name": "情感投入", "color": "#B56060" },
    { "key": "know", "name": "了解程度", "color": "#4A6B8A" },
    { "key": "accept", "name": "包容度", "color": "#6B8E6F" },
    { "key": "security", "name": "安全感", "color": "#B89260" },
    { "key": "sacrifice", "name": "付出意愿", "color": "#8B5E5E" },
    { "key": "communicate", "name": "沟通质量", "color": "#5A7A5E" },
    { "key": "future", "name": "未来规划", "color": "#7B9AD6" },
    { "key": "ritual", "name": "仪式感", "color": "#B08968" }
  ],
  "questions": [
    { "id": "q001", "dim": "emotion", "type": "likert", "text": "你有多常主动关心 TA 今天过得好不好？", "options": ["几乎从不", "偶尔", "一半一半", "经常", "每天都会"], "scores": [1, 2, 3, 4, 5] },
    { "id": "q002", "dim": "emotion", "type": "likert", "text": "TA 不开心的时候，你能第一时间发现吗？", "options": ["完全发现不了", "偶尔能", "看情况", "大部分能", "每次都能"], "scores": [1, 2, 3, 4, 5] },
    { "id": "q003", "dim": "emotion", "type": "likert", "text": "你会记得 TA 随口说过的小事吗？", "options": ["完全不记得", "偶尔记得", "有些记得", "大部分记得", "全都记得"], "scores": [1, 2, 3, 4, 5] },
    { "id": "q004", "dim": "emotion", "type": "scenario", "text": "TA 加班到很晚才回家，你会怎么做？", "options": ["等 TA 回来，给 TA 倒杯热水", "发消息问 TA 到哪了", "先睡了，明天再说", "假装没注意到"], "scores": [5, 4, 2, 1] },
    { "id": "q005", "dim": "emotion", "type": "likert", "text": "你会主动说「我想你了」吗？", "options": ["从来不说", "很少说", "偶尔说", "经常说", "每天都说"], "scores": [1, 2, 3, 4, 5] },
    { "id": "q006", "dim": "emotion", "type": "likert", "text": "你会关注 TA 的朋友圈或社交动态吗？", "options": ["完全不关注", "偶尔看看", "会看但不评论", "经常看", "每条都看"], "scores": [1, 2, 3, 4, 5] },
    { "id": "q007", "dim": "emotion", "type": "scenario", "text": "TA 跟你说今天遇到一件开心的事，你会？", "options": ["认真听，跟着开心，追问细节", "嗯一声表示知道了", "敷衍一下，继续做自己的事", "打断 TA，说自己也有事"], "scores": [5, 3, 2, 1] },
    { "id": "q008", "dim": "know", "type": "likert", "text": "你知道 TA 最喜欢吃什么吗？", "options": ["完全不知道", "大概知道", "知道一些", "很清楚", "闭着眼都能点"], "scores": [1, 2, 3, 4, 5] },

(function (global) {
  'use strict';
  let toastTimer = null;
  function toast(msg, ms = 1800) {
    let el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), ms);
  }
  function navigate(hash) {
    if (location.hash === hash) { window.dispatchEvent(new Event('hashchange')); }
    else { location.hash = hash; }
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast('已复制到剪贴板')).catch(() => fallbackCopy(text));
    } else { fallbackCopy(text); }
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败，请长按选中'); }
    document.body.removeChild(ta);
  }
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  global.LGA_UI = { toast, navigate, copyText, escapeHTML };
})(window);

      ctx.fillText(dims[i].name, cx + (r + 20) * Math.cos(angle), cy + (r + 20) * Math.sin(angle));
    }
  }
  function renderResultPage(container, result, slot) {
    const dims = LGA_QUESTIONS.getDimensions();
    const slotLabel = slot === 'A' ? '你' : 'TA';
    let html = `<div class="result-header"><div class="rh-label">${slotLabel}的测试结果</div><div class="rh-score">${result.total}</div><div class="rh-total">总分（满分 100）</div></div><div class="result-radar"><canvas id="radarCanvas" width="300" height="300"></canvas></div><div class="result-dims">`;
    for (const dim of dims) {
      const score = result.scores[dim.key] || 0;
      html += `<div class="dim-row"><div class="dim-name">${dim.name}</div><div class="dim-bar"><div class="dim-fill" style="width:${score}%;background:${dim.color};"></div></div><div class="dim-score" style="color:${dim.color};">${score}</div></div>`;
    }
    html += '</div>';
    let conclusion = '';
    if (result.total >= 90) conclusion = '你是一个满分恋人！对方真的很幸运。';
    else if (result.total >= 75) conclusion = '你对这段感情投入很多，继续保持。';
    else if (result.total >= 60) conclusion = '你做得不错，还有一些空间可以提升。';
    else if (result.total >= 40) conclusion = '你们的感情还有提升空间，多用心经营。';
    else conclusion = '建议多花时间了解对方，用心经营这段感情。';
    html += `<div class="result-conclusion"><div class="rc-title">分析</div><div class="rc-text">${conclusion}</div></div><div class="result-actions"><button class="btn btn-primary btn-block" id="shareMyResult">生成分享卡片</button><button class="btn btn-ghost btn-block" id="goHome">返回首页</button></div>`;
    container.innerHTML = html;
    const canvas = document.getElementById('radarCanvas');
    if (canvas) renderRadar(canvas, result.scores, slot === 'A' ? '#4A6B8A' : '#E8888A', slotLabel);
  }
  function renderComparePage(container, resultA, resultB) {
    const dims = LGA_QUESTIONS.getDimensions();
    let html = `<div class="compare-header"><div class="compare-legend"><div class="legend-item"><div class="legend-dot legend-a"></div>你</div><div class="legend-item"><div class="legend-dot legend-b"></div>TA</div></div><div class="compare-scores"><div class="cs-item cs-a"><div class="cs-label">你的总分</div><div class="cs-score">${resultA.total}</div></div><div class="cs-item cs-b"><div class="cs-label">TA 的总分</div><div class="cs-score">${resultB.total}</div></div></div></div><div class="compare-radar"><canvas id="compareRadar" width="300" height="300"></canvas></div><div class="compare-dims">`;
    for (const dim of dims) {
      const scoreA = resultA.scores[dim.key] || 0;
      const scoreB = resultB.scores[dim.key] || 0;
      html += `<div class="cdim-row"><div class="cdim-name">${dim.name}</div><div class="cdim-bars"><div class="cdim-bar-a" style="width:${scoreA}%;"></div><div class="cdim-bar-b" style="width:${scoreB}%;"></div></div><div class="cdim-scores"><span class="cdim-sa">${scoreA}</span><span class="cdim-sb">${scoreB}</span></div></div>`;
    }
    html += '</div>';
    let winner = resultA.total >= resultB.total ? '你' : 'TA';
    let diff = Math.abs(resultA.total - resultB.total);
    let conclusion = '';
    if (diff <= 5) conclusion = '你们的爱势均力敌，真是天造地设的一对！';
    else if (diff <= 15) conclusion = `${winner}更爱对方一些，但差距不大。`;
    else conclusion = `${winner}在这段感情中付出更多，建议多关注对方的感受。`;
    html += `<div class="compare-conclusion"><div class="cc-title">谁更爱对方？</div><div class="cc-text">${conclusion}</div></div><div class="result-actions"><button class="btn btn-primary btn-block" id="shareCompare">生成分享卡片</button><button class="btn btn-ghost btn-block" id="goHome">返回首页</button></div>`;
    container.innerHTML = html;
    const canvas = document.getElementById('compareRadar');
    if (canvas) renderRadarCompare(canvas, resultA.scores, resultB.scores);
  }
  global.LGA_RESULT = { renderRadar, renderRadarCompare, renderResultPage, renderComparePage };
})(window);

/* ========== 分享卡片生成 ========== */
(function (global) {
  'use strict';
  const CARD_WIDTH = 750, CARD_HEIGHT = 1334;
  function generateShareCard(result, slot) {
    const canvas = document.createElement('canvas');
    canvas.width = CARD_WIDTH; canvas.height = CARD_HEIGHT;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FBF9F4'; ctx.fillRect(0, 0, CARD_WIDTH, CARD_HEIGHT);
    ctx.fillStyle = '#4A6B8A'; ctx.fillRect(0, 0, CARD_WIDTH, 6);
    ctx.font = 'bold 48px "Noto Serif SC", "Songti SC", serif'; ctx.fillStyle = '#2B2B2B'; ctx.textAlign = 'center';
    ctx.fillText('谁更爱对方', CARD_WIDTH / 2, 120);
    ctx.font = '28px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#5A5650';
    ctx.fillText('情侣测试结果', CARD_WIDTH / 2, 170);
    ctx.strokeStyle = '#E6E1D6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(100, 200); ctx.lineTo(CARD_WIDTH - 100, 200); ctx.stroke();
    const slotLabel = slot === 'A' ? '你的结果' : 'TA 的结果';
    ctx.font = 'bold 32px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#4A6B8A';
    ctx.fillText(slotLabel, CARD_WIDTH / 2, 260);
    ctx.font = 'bold 120px "Noto Serif SC", "Songti SC", serif'; ctx.fillStyle = '#4A6B8A';
    ctx.fillText(String(result.total), CARD_WIDTH / 2, 400);
    ctx.font = '24px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#9A958C';
    ctx.fillText('总分（满分 100）', CARD_WIDTH / 2, 440);
    const dims = LGA_QUESTIONS.getDimensions();
    const startY = 520, rowHeight = 60;
    for (let i = 0; i < dims.length; i++) {
      const dim = dims[i], score = result.scores[dim.key] || 0, y = startY + i * rowHeight;
      ctx.font = '26px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#5A5650'; ctx.textAlign = 'left';
      ctx.fillText(dim.name, 100, y);
      ctx.fillStyle = '#E6E1D6'; ctx.beginPath(); ctx.roundRect(280, y - 16, 320, 16, 8); ctx.fill();
      ctx.fillStyle = dim.color; ctx.beginPath(); ctx.roundRect(280, y - 16, 320 * score / 100, 16, 8); ctx.fill();
      ctx.font = 'bold 26px "Noto Serif SC", "Songti SC", serif'; ctx.fillStyle = dim.color; ctx.textAlign = 'right';
      ctx.fillText(String(score), CARD_WIDTH - 100, y);
    }
    const conclusionY = startY + dims.length * rowHeight + 40;
    ctx.fillStyle = '#EEF2F7'; ctx.beginPath(); ctx.roundRect(60, conclusionY, CARD_WIDTH - 120, 120, 16); ctx.fill();
    ctx.font = '28px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#36506B'; ctx.textAlign = 'center';
    let conclusion = '';
    if (result.total >= 90) conclusion = '你是一个满分恋人！';
    else if (result.total >= 75) conclusion = '你对这段感情投入很多';
    else if (result.total >= 60) conclusion = '你做得不错，还有提升空间';
    else if (result.total >= 40) conclusion = '你们的感情还有提升空间';
    else conclusion = '建议多用心经营这段感情';
    ctx.fillText(conclusion, CARD_WIDTH / 2, conclusionY + 50);
    ctx.font = '20px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#9A958C'; ctx.textAlign = 'center';
    ctx.fillText('谁更爱对方 · 情侣测试', CARD_WIDTH / 2, CARD_HEIGHT - 100);
    ctx.fillText('52 道专业测评题，测出谁更爱对方', CARD_WIDTH / 2, CARD_HEIGHT - 60);
    return canvas;
  }
  function generateCompareCard(resultA, resultB) {
    const canvas = document.createElement('canvas');
    canvas.width = CARD_WIDTH; canvas.height = CARD_HEIGHT;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FBF9F4'; ctx.fillRect(0, 0, CARD_WIDTH, CARD_HEIGHT);
    ctx.fillStyle = '#4A6B8A'; ctx.fillRect(0, 0, CARD_WIDTH, 6);
    ctx.font = 'bold 48px "Noto Serif SC", "Songti SC", serif'; ctx.fillStyle = '#2B2B2B'; ctx.textAlign = 'center';
    ctx.fillText('谁更爱对方', CARD_WIDTH / 2, 120);
    ctx.font = '28px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#5A5650';
    ctx.fillText('情侣对比结果', CARD_WIDTH / 2, 170);
    ctx.strokeStyle = '#E6E1D6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(100, 200); ctx.lineTo(CARD_WIDTH - 100, 200); ctx.stroke();
    ctx.font = 'bold 32px "Noto Sans SC", sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#4A6B8A'; ctx.fillText('你', 200, 260);
    ctx.font = 'bold 80px "Noto Serif SC", "Songti SC", serif'; ctx.fillText(String(resultA.total), 200, 350);
    ctx.font = 'bold 36px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#9A958C'; ctx.fillText('VS', CARD_WIDTH / 2, 310);
    ctx.font = 'bold 32px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#E8888A'; ctx.fillText('TA', 550, 260);
    ctx.font = 'bold 80px "Noto Serif SC", "Songti SC", serif'; ctx.fillText(String(resultB.total), 550, 350);
    let winner = resultA.total >= resultB.total ? '你' : 'TA';
    let diff = Math.abs(resultA.total - resultB.total);
    let conclusion = '';
    if (diff <= 5) conclusion = '你们的爱势均力敌！';
    else if (diff <= 15) conclusion = `${winner}更爱对方一些`;
    else conclusion = `${winner}在这段感情中付出更多`;
    ctx.font = 'bold 36px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#36506B';
    ctx.fillText(conclusion, CARD_WIDTH / 2, 430);
    const dims = LGA_QUESTIONS.getDimensions();
    const startY = 520, rowHeight = 55;
    for (let i = 0; i < dims.length; i++) {
      const dim = dims[i], scoreA = resultA.scores[dim.key] || 0, scoreB = resultB.scores[dim.key] || 0, y = startY + i * rowHeight;
      ctx.font = '24px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#5A5650'; ctx.textAlign = 'left';
      ctx.fillText(dim.name, 80, y);
      ctx.fillStyle = '#4A6B8A'; ctx.textAlign = 'center'; ctx.fillText(String(scoreA), 280, y);
      ctx.fillStyle = '#E8888A'; ctx.fillText(String(scoreB), 470, y);
      const barY = y + 8;
      ctx.fillStyle = '#E6E1D6'; ctx.beginPath(); ctx.roundRect(540, barY, 150, 10, 5); ctx.fill();
      ctx.fillStyle = '#4A6B8A'; ctx.beginPath(); ctx.roundRect(540, barY, 150 * scoreA / 100, 10, 5); ctx.fill();
      ctx.fillStyle = '#E6E1D6'; ctx.beginPath(); ctx.roundRect(540, barY + 14, 150, 10, 5); ctx.fill();
      ctx.fillStyle = '#E8888A'; ctx.beginPath(); ctx.roundRect(540, barY + 14, 150 * scoreB / 100, 10, 5); ctx.fill();
    }
    ctx.font = '20px "Noto Sans SC", sans-serif'; ctx.fillStyle = '#9A958C'; ctx.textAlign = 'center';
    ctx.fillText('谁更爱对方 · 情侣测试', CARD_WIDTH / 2, CARD_HEIGHT - 100);
    ctx.fillText('52 道专业测评题，测出谁更爱对方', CARD_WIDTH / 2, CARD_HEIGHT - 60);
    return canvas;
  }
  function downloadCanvas(canvas, filename) {
    const link = document.createElement('a');
    link.download = filename || '谁更爱对方-测试结果.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
  function showShareModal(canvas) {
    const modal = document.createElement('div');
    modal.className = 'share-modal';
    modal.innerHTML = `<div class="share-modal-mask"></div><div class="share-modal-content"><div class="share-modal-title">长按保存图片</div><img class="share-modal-img" src="${canvas.toDataURL('image/png')}" alt="分享卡片"><button class="btn btn-primary btn-block" id="downloadBtn">下载图片</button><button class="btn btn-ghost btn-block" id="closeModal">关闭</button></div>`;
    document.body.appendChild(modal);
    const style = document.createElement('style');
    style.textContent = `.share-modal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center}.share-modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.5)}.share-modal-content{position:relative;background:#fff;border-radius:18px;padding:20px;max-width:90%;max-height:90vh;overflow-y:auto}.share-modal-title{font-family:var(--serif);font-size:1.1rem;font-weight:600;text-align:center;margin-bottom:12px}.share-modal-img{width:100%;border-radius:12px;margin-bottom:12px}.share-modal-content .btn{margin-bottom:8px}`;
    document.head.appendChild(style);
    document.getElementById('downloadBtn').onclick = () => downloadCanvas(canvas);
    document.getElementById('closeModal').onclick = () => { modal.remove(); style.remove(); };
    modal.querySelector('.share-modal-mask').onclick = () => { modal.remove(); style.remove(); };
  }
  global.LGA_SHARE = { generateShareCard, generateCompareCard, downloadCanvas, showShareModal };
})(window);

/* ========== 主控制器 ========== */
(function (global) {
  'use strict';
  const pageIds = ['page-home', 'page-test', 'page-done', 'page-result', 'page-compare'];
  function showPage(id) { pageIds.forEach(x => document.getElementById(x)?.classList.toggle('active', x === id)); }
  function escapeHTML(s) { return LGA_UI.escapeHTML(s); }
  function renderHome() {
    showPage('page-home');
    const hasResultA = LGA_TEST.hasResult('A');
    const viewBtn = document.getElementById('viewResultBtn');
    if (viewBtn) viewBtn.style.display = hasResultA ? '' : 'none';
  }
  function renderTest() { showPage('page-test'); LGA_TEST.init(); drawQuestion(); }
  function drawQuestion() {
    const questions = LGA_QUESTIONS.getQuestions();
    const idx = LGA_TEST.getCurrentIndex();
    if (idx >= questions.length) { finishTest(); return; }
    const q = questions[idx], dim = LGA_QUESTIONS.getDimension(q.dim), progress = LGA_TEST.getProgress();
    document.getElementById('testProgress').textContent = `${progress.current}/${progress.total}`;
    document.getElementById('progressFill').style.width = `${(idx / questions.length) * 100}%`;
    const dimEl = document.getElementById('qDim');
    dimEl.textContent = dim.name;
    dimEl.style.background = dim.color + '22';
    dimEl.style.color = dim.color;
    document.getElementById('qText').textContent = q.text;
    const optBox = document.getElementById('qOptions');
    const letters = ['A', 'B', 'C', 'D', 'E'];
    const selected = LGA_TEST.getAnswer(q.id);
    optBox.innerHTML = q.options.map((opt, i) => `<div class="q-opt ${selected === i ? 'selected' : ''}" data-idx="${i}"><span class="qo-letter">${letters[i]}</span><span class="qo-text">${escapeHTML(opt)}</span></div>`).join('');
    optBox.querySelectorAll('.q-opt').forEach(el => {
      el.onclick = () => {
        const idx = parseInt(el.dataset.idx, 10);
        LGA_TEST.setAnswer(q.id, idx);
        LGA_TEST.setAnswered(true);
        optBox.querySelectorAll('.q-opt').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
        setTimeout(() => nextQuestion(), 300);
      };
    });
    document.getElementById('prevBtn').disabled = idx === 0;
    document.getElementById('nextBtn').textContent = idx === questions.length - 1 ? '完成' : '下一题';
  }
  function nextQuestion() {
    const questions = LGA_QUESTIONS.getQuestions();
    const idx = LGA_TEST.getCurrentIndex();
    if (idx < questions.length - 1) { LGA_TEST.setCurrentIndex(idx + 1); drawQuestion(); }
    else { finishTest(); }
  }
  function prevQuestion() {
    const idx = LGA_TEST.getCurrentIndex();
    if (idx > 0) { LGA_TEST.setCurrentIndex(idx - 1); drawQuestion(); }
  }
  function finishTest() {
    let slot = 'A';
    if (LGA_TEST.hasResult('A')) slot = 'B';
    LGA_TEST.saveResult(slot);
    LGA_TEST.clearProgress();
    showPage('page-done');
  }
  function renderResult(slot) {
    showPage('page-result');
    const result = LGA_TEST.getResult(slot);
    if (!result) {
      document.getElementById('resultPage').innerHTML = `<div class="empty-state"><div class="em-word">?</div><div class="em-t">还没有测试结果</div><div class="small faint">先完成一次测试吧</div><button class="btn btn-primary" id="goTest" style="margin-top:16px;">开始测试</button></div>`;
      document.getElementById('goTest').onclick = () => LGA_UI.navigate('#test');
      return;
    }
    LGA_RESULT.renderResultPage(document.getElementById('resultPage'), result, slot);
    document.getElementById('shareMyResult').onclick = () => {
      const canvas = LGA_SHARE.generateShareCard(result, slot);
      LGA_SHARE.showShareModal(canvas);
    };
    document.getElementById('goHome').onclick = () => LGA_UI.navigate('#home');
  }
  function renderCompare() {
    showPage('page-compare');
    const resultA = LGA_TEST.getResult('A'), resultB = LGA_TEST.getResult('B');
    if (!resultA || !resultB) {
      document.getElementById('comparePage').innerHTML = `<div class="empty-state"><div class="em-word">2</div><div class="em-t">需要两人都完成测试</div><div class="small faint">${!resultA ? '你还没做测试' : 'TA 还没做测试'}</div><button class="btn btn-primary" id="goTest" style="margin-top:16px;">开始测试</button></div>`;
      document.getElementById('goTest').onclick = () => LGA_UI.navigate('#test');
      return;
    }
    LGA_RESULT.renderComparePage(document.getElementById('comparePage'), resultA, resultB);
    document.getElementById('shareCompare').onclick = () => {
      const canvas = LGA_SHARE.generateCompareCard(resultA, resultB);
      LGA_SHARE.showShareModal(canvas);
    };
    document.getElementById('goHome').onclick = () => LGA_UI.navigate('#home');
  }
  function route() {
    const raw = location.hash.replace(/^#/, '') || 'home';
    const parts = raw.split('/');
    if (parts[0] === 'home') renderHome();
    else if (parts[0] === 'test') renderTest();
    else if (parts[0] === 'done') showPage('page-done');
    else if (parts[0] === 'result') renderResult('A');
    else if (parts[0] === 'compare') renderCompare();
    else LGA_UI.navigate('#home');
  }
  function init() {
    LGA_QUESTIONS.init();
    LGA_TEST.init();
    document.getElementById('startBtn').onclick = () => LGA_UI.navigate('#test');
    document.getElementById('viewResultBtn').onclick = () => LGA_UI.navigate('#result');
    document.getElementById('testBack').onclick = () => LGA_UI.navigate('#home');
    document.getElementById('prevBtn').onclick = prevQuestion;
    document.getElementById('nextBtn').onclick = nextQuestion;
    document.getElementById('shareLinkBtn').onclick = () => { LGA_UI.copyText(location.href); };
    document.getElementById('viewMyResultBtn').onclick = () => LGA_UI.navigate('#result');
    document.getElementById('resultBack').onclick = () => LGA_UI.navigate('#home');
    document.getElementById('compareBack').onclick = () => LGA_UI.navigate('#home');
    window.addEventListener('hashchange', route);
    route();
  }
  global.LGA_APP = { init, route, renderHome, renderTest, renderResult, renderCompare };
})(window);

document.addEventListener('DOMContentLoaded', () => { LGA_APP.init(); });
  </script>
</body>
</html>
